<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Number</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>



  <!-- Header -->
  <header class="header">
    <section class="container header__inner">
      <a href="#" class="logo">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="logo__text">Number <span class="accent">Guess</span></span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#" class="nav__link nav__link--active">Home</a>
        <a href="#" class="nav__link">Stats</a>
        <a href="#" class="nav__link">Settings</a>
      </nav>

      <button class="icon-btn theme-btn" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </section>
  </header>

  <!---------- background --------->
  <main class="main">
    <div class="decor decor--planet-big" aria-hidden="true"></div>
    <div class="decor decor--planet-left" aria-hidden="true"></div>
    <div class="decor decor--orb" aria-hidden="true"></div>

    <div class="container hero">
  <!-------------------------------->
      
      <section class="intro">
        <p class="intro__eyebrow">A simple game. A big challenge.</p>
        <h1 class="intro__title">Number <span class="accent">Guess</span></h1>
        <p class="intro__text">
          Think logically. Make the right guess.<br>
          Can you find the hidden number?
        </p>

        <div class="intro__actions">
          <button class="btn btn--primary" id="start-btn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
            Start Game
          </button>
          <button class="btn btn--ghost" id="howto-btn" type="button">
            <span class="icon-btn icon-btn--round" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>
              </svg>
            </span>
            How to Play
          </button>
        </div>
      </section>

      <!-- Game card -->
      <section class="card" aria-labelledby="difficulty-label">
        <h2 class="label" id="difficulty-label">Choose difficulty</h2>

        <div class="levels" role="radiogroup" aria-labelledby="difficulty-label">
          <label class="level level--easy">
            <input type="radio" name="difficulty" value="easy" data-max="50" data-guesses="6" checked>
            <span class="level__box">
              <span class="level__dot"></span>
              <span class="level__name">Easy</span>
              <span class="level__range">1 – 50</span>
            </span>
          </label>

          <label class="level level--medium">
            <input type="radio" name="difficulty" value="medium" data-max="100" data-guesses="10">
            <span class="level__box">
              <span class="level__dot"></span>
              <span class="level__name">Medium</span>
              <span class="level__range">1 – 100</span>
            </span>
          </label>

          <label class="level level--hard">
            <input type="radio" name="difficulty" value="hard" data-max="500" data-guesses="12">
            <span class="level__box">
              <span class="level__dot"></span>
              <span class="level__name">Hard</span>
              <span class="level__range">1 – 500</span>
            </span>
          </label>
        </div>

        <label class="label" for="guess">Your guess</label>
        <input class="input" id="guess" type="number" inputmode="numeric" placeholder="Enter a number...">
        <p class="message" id="message" role="status" aria-live="polite"></p>

        <button class="btn btn--primary btn--block" id="check-btn" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          Check
        </button>

        <div class="stats">
          <div class="stat">
            <span class="icon-btn icon-btn--round" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
            </span>
            <div>
              <p class="stat__label">Range</p>
              <p class="stat__value" id="range-value">1 – 50</p>
            </div>
          </div>

          <div class="stat">
            <span class="icon-btn icon-btn--round" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
            </span>
            <div>
              <p class="stat__label">Guesses</p>
              <p class="stat__value" id="guesses-value">0 / 6</p>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__inner">
      <a href="#" class="logo logo--small">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="logo__text">Number <span class="accent">Guess</span></span>
      </a>
      <p class="footer__meta">
        <span>Made for curious minds.</span>
        <span>v1.0.0</span>
      </p>
    </div>
  </footer>

  <script src="js/script.js"></script>


  <script src="js/index.js"></script>
</body>
</html>
